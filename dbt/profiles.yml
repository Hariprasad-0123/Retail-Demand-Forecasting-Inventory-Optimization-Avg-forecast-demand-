retail_demand:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('PROJECT_ID', 'demo-project') }}"
      dataset: "{{ env_var('DATASET_ID', 'retail_demand') }}"
      threads: 4
      timeout_seconds: 300
      location: US
      priority: interactive
      retries: 1
